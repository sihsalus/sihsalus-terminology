name: Terminology runtime

on:
  push:
    branches: [main, feature/terminology-runtime]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Check or apply configuration on the installed release
        type: choice
        options: [none, check, apply]
        default: none

permissions:
  contents: read

concurrency:
  group: terminology-${{ github.ref }}-${{ inputs.configuration == 'check' || inputs.configuration == 'apply' }}
  cancel-in-progress: false

jobs:
  web-dependencies:
    if: inputs.configuration == '' || inputs.configuration == 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm audit --package-lock-only --omit=dev --audit-level=high

  api-checks:
    if: inputs.configuration == '' || inputs.configuration == 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: ci
      NO_LM: 'TRUE'
      NO_ENCODER: 'TRUE'
      ANALYTICS_API: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py test core.common.test_optional_ai core.common.test_storage_proxy core.common.test_deployment_access core.middlewares.tests --verbosity 2
      - run: pylint core/common/test_optional_ai.py core/common/test_storage_proxy.py core/common/test_deployment_access.py core/common/search.py core/common/utils.py core/settings.py core/concepts/views.py core/users/views.py core/middlewares/middlewares.py core/services/storages/cloud/minio.py core/importers/export_converter.py

  images:
    needs: [api-checks, web-dependencies, operations]
    if: github.event_name != 'pull_request' && (inputs.configuration == '' || inputs.configuration == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: api, context: apps/api}
          - {app: web, context: apps/web}
          - {app: postgres, context: images/postgres}
          - {app: redis, context: images/redis}
          - {app: elasticsearch, context: images/elasticsearch}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sihsalus/terminology-${{ matrix.app }}:candidate-${{ github.sha }}-${{ github.run_id }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=terminology-${{ matrix.app }}
          cache-to: type=gha,scope=terminology-${{ matrix.app }},mode=max
      - name: Check runtime identity and size
        env:
          IMAGE: ghcr.io/sihsalus/terminology-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          APP: ${{ matrix.app }}
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE")
          test "$size" -lt 1610612736
          if [ "$APP" = api ]; then
            docker run --rm -e ENVIRONMENT=ci "$IMAGE" python manage.py check
            docker run --rm "$IMAGE" python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'sentence_transformers', 'pytest', 'pylint', 'pip'))"
          fi
          if [ "$APP" = postgres ]; then
            docker run -d --name candidate --memory 640m -e POSTGRES_PASSWORD=synthetic-ci-only "$IMAGE"
            for ((attempt=0; attempt<30; attempt++)); do
              if docker exec candidate pg_isready -U postgres; then break; fi
              sleep 2
            done
            docker exec candidate psql -U postgres -c 'SELECT 1'
          elif [ "$APP" = redis ]; then
            docker run -d --name candidate --memory 256m "$IMAGE"
            for ((attempt=0; attempt<30; attempt++)); do
              if docker exec candidate redis-cli ping; then break; fi
              sleep 2
            done
            test "$(docker exec candidate redis-cli ping)" = PONG
          elif [ "$APP" = elasticsearch ]; then
            docker run -d --name candidate --memory 1536m -e discovery.type=single-node -e xpack.security.enabled=false -e 'ES_JAVA_OPTS=-Xms512m -Xmx512m' "$IMAGE"
            for ((attempt=0; attempt<60; attempt++)); do
              if docker exec candidate curl -fsS http://localhost:9200/; then break; fi
              sleep 3
            done
            docker exec candidate curl -fsS -X PUT -H 'Content-Type: application/json' http://localhost:9200/synthetic/_doc/1 -d '{"name":"rodilla"}'
            docker exec candidate curl -fsS http://localhost:9200/synthetic/_doc/1 | jq -e '._source.name == "rodilla"'
            # Exercise Tika/jsoup through Elasticsearch, using a synthetic HTML attachment.
            docker exec candidate curl -fsS -X POST -H 'Content-Type: application/json' \
              http://localhost:9200/_ingest/pipeline/_simulate \
              -d '{"pipeline":{"processors":[{"attachment":{"field":"data","remove_binary":true}}]},"docs":[{"_source":{"data":"PGh0bWw+PGJvZHk+U3ludGhldGljIHRlcm1pbm9sb2d5IGRvY3VtZW50PC9ib2R5PjwvaHRtbD4="}}]}' \
              | jq -e '.docs[0].doc._source.attachment.content | contains("Synthetic terminology document")'
          fi
          printf '%s\n' "$IMAGE" > image-ref.txt
          printf 'Image bytes: %s\n' "$size" >> "$GITHUB_STEP_SUMMARY"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.74.0
          cache: true
      - name: Scan candidate
        env:
          IMAGE: ghcr.io/sihsalus/terminology-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output security.json "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.build.outcome == 'success'
        with:
          name: terminology-${{ matrix.app }}-${{ github.sha }}
          path: |
            image-ref.txt
            security.json
          if-no-files-found: error

  operations:
    name: Validate operations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check configuration synchronization and Compose
        run: |
          python3 -B -m unittest discover -s tests/deploy -p 'test_*.py' -v
          python3 -B tests/deploy/terminology-compose.py
          for script in scripts/deploy/*.sh scripts/terminology/*.sh scripts/security/*.sh; do bash -n "$script"; done
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.74.0
          cache: true
      - name: Scan pinned infrastructure images
        run: |
          bash scripts/security/secrets_generate.sh "$RUNNER_TEMP/terminology.env"
          export TERMINOLOGY_HOST=terminology.example.org
          export TERMINOLOGY_API_HOST=api.terminology.example.org
          export TERMINOLOGY_API_IMAGE=ghcr.io/sihsalus/terminology-api:scan-render-only
          export TERMINOLOGY_WEB_IMAGE=ghcr.io/sihsalus/terminology-web:scan-render-only
          export TERMINOLOGY_POSTGRES_IMAGE=ghcr.io/sihsalus/terminology-postgres:scan-render-only
          export TERMINOLOGY_REDIS_IMAGE=ghcr.io/sihsalus/terminology-redis:scan-render-only
          export TERMINOLOGY_ELASTICSEARCH_IMAGE=ghcr.io/sihsalus/terminology-elasticsearch:scan-render-only
          docker compose --env-file "$RUNNER_TEMP/terminology.env" -f docker-compose.terminology.yml config --format json > "$RUNNER_TEMP/terminology.json"
          mkdir reports
          failed=0
          # The runtime workflow builds and scans the five SIHSALUS images.
          # Storage is consumed directly from its verified upstream digest.
          for service in storage; do
            image=$(jq -r --arg service "$service" '.services[$service].image' "$RUNNER_TEMP/terminology.json")
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "reports/$service.json" "$image" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: terminology-service-security
          path: reports/
          if-no-files-found: error

  release:
    name: Collect verified release
    needs: [images, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
      - name: Create manifest from this run's successful image checks
        run: |
          python3 scripts/terminology/release.py manifest artifacts --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" > release.json
          printf 'Verified release: %s (run %s). Not deployed.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminology-release-${{ github.sha }}
          path: release.json
          if-no-files-found: error

  configuration:
    name: Synchronize terminology configuration
    if: github.event_name == 'workflow_dispatch' && inputs.configuration != 'none'
    needs: operations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: terminology
      url: https://${{ vars.TERMINOLOGY_HOST }}
    concurrency:
      group: terminology-configuration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply the private environment through restricted SSH
        env:
          CONFIGURATION_MODE: ${{ inputs.configuration }}
          TERMINOLOGY_SSH_TARGET: ${{ vars.TERMINOLOGY_SSH_TARGET }}
          TERMINOLOGY_SSH_KNOWN_HOSTS: ${{ vars.TERMINOLOGY_SSH_KNOWN_HOSTS }}
          TERMINOLOGY_SSH_PRIVATE_KEY: ${{ secrets.TERMINOLOGY_SSH_PRIVATE_KEY }}
          TERMINOLOGY_DB_PASSWORD: ${{ secrets.TERMINOLOGY_DB_PASSWORD }}
          TERMINOLOGY_SECRET_KEY: ${{ secrets.TERMINOLOGY_SECRET_KEY }}
          TERMINOLOGY_ADMIN_PASSWORD: ${{ secrets.TERMINOLOGY_ADMIN_PASSWORD }}
          TERMINOLOGY_ADMIN_TOKEN: ${{ secrets.TERMINOLOGY_ADMIN_TOKEN }}
          TERMINOLOGY_STORAGE_ACCESS_KEY: ${{ secrets.TERMINOLOGY_STORAGE_ACCESS_KEY }}
          TERMINOLOGY_STORAGE_SECRET_KEY: ${{ secrets.TERMINOLOGY_STORAGE_SECRET_KEY }}
          TERMINOLOGY_EMAIL_HOST_PASSWORD: ${{ secrets.TERMINOLOGY_EMAIL_HOST_PASSWORD }}
          TERMINOLOGY_HOST: ${{ vars.TERMINOLOGY_HOST }}
          TERMINOLOGY_API_HOST: ${{ vars.TERMINOLOGY_API_HOST }}
          TERMINOLOGY_MACHINE_ID: ${{ vars.TERMINOLOGY_MACHINE_ID }}
          TERMINOLOGY_BACKUP_KEEP: ${{ vars.TERMINOLOGY_BACKUP_KEEP }}
          TERMINOLOGY_EMAIL_BACKEND: ${{ vars.TERMINOLOGY_EMAIL_BACKEND }}
          TERMINOLOGY_EMAIL_HOST: ${{ vars.TERMINOLOGY_EMAIL_HOST }}
          TERMINOLOGY_EMAIL_PORT: ${{ vars.TERMINOLOGY_EMAIL_PORT }}
          TERMINOLOGY_EMAIL_HOST_USER: ${{ vars.TERMINOLOGY_EMAIL_HOST_USER }}
          TERMINOLOGY_DEFAULT_FROM_EMAIL: ${{ vars.TERMINOLOGY_DEFAULT_FROM_EMAIL }}
          TERMINOLOGY_COMMUNITY_EMAIL: ${{ vars.TERMINOLOGY_COMMUNITY_EMAIL }}
          TERMINOLOGY_REPORTS_EMAIL: ${{ vars.TERMINOLOGY_REPORTS_EMAIL }}
          TERMINOLOGY_ADMIN_EMAIL: ${{ vars.TERMINOLOGY_ADMIN_EMAIL }}
        run: python3 scripts/terminology/sync-github-config.py send
