name: Terminology availability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: terminology-availability
  cancel-in-progress: false


jobs:
  probe:
    name: Probe service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: terminology
    env:
      TERMINOLOGY_HOST: ${{ vars.TERMINOLOGY_HOST }}
      TERMINOLOGY_API_HOST: ${{ vars.TERMINOLOGY_API_HOST }}
      TERMINOLOGY_EMAIL_HOST: ${{ vars.TERMINOLOGY_EMAIL_HOST }}
      TERMINOLOGY_EMAIL_PORT: ${{ vars.TERMINOLOGY_EMAIL_PORT }}
      TERMINOLOGY_EMAIL_HOST_USER: ${{ vars.TERMINOLOGY_EMAIL_HOST_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check public services and SMTP without sending test mail
        env:
          TERMINOLOGY_EMAIL_HOST_PASSWORD: ${{ secrets.TERMINOLOGY_EMAIL_HOST_PASSWORD }}
        run: python3 -B scripts/terminology/monitor.py probe

  notify:
    name: Notify group
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: terminology
    env:
      TERMINOLOGY_HOST: ${{ vars.TERMINOLOGY_HOST }}
      TERMINOLOGY_API_HOST: ${{ vars.TERMINOLOGY_API_HOST }}
      TERMINOLOGY_EMAIL_HOST: ${{ vars.TERMINOLOGY_EMAIL_HOST }}
      TERMINOLOGY_EMAIL_PORT: ${{ vars.TERMINOLOGY_EMAIL_PORT }}
      TERMINOLOGY_EMAIL_HOST_USER: ${{ vars.TERMINOLOGY_EMAIL_HOST_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Notify only initial state, transitions or failed notification retries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TERMINOLOGY_MONITOR_RECIPIENT: ${{ vars.TERMINOLOGY_MONITOR_RECIPIENT }}
          PROBE_RESULT: ${{ needs.probe.result }}
          TERMINOLOGY_EMAIL_HOST_PASSWORD: ${{ secrets.TERMINOLOGY_EMAIL_HOST_PASSWORD }}
        run: python3 -B scripts/terminology/monitor.py notify
