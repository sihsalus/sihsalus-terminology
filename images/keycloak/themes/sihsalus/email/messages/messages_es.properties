# Keycloak formats {3}/{4} with the time unit; do not append "minutos".
emailVerificationSubject=SIHSALUS: confirma tu correo
emailVerificationBody=Recibimos una solicitud para usar este correo en {2}.\n\nSi fuiste tú, confirma tu correo con este enlace:\n\n{0}\n\nEl enlace caduca en {3}.\n\nSi estás creando tu cuenta, después de confirmar el correo podrás definir tu contraseña. El acceso para editar catálogos lo habilita el equipo de SIHSALUS.\n\nSi el enlace venció y aún no puedes entrar, vuelve a Iniciar sesión y selecciona «¿Olvidaste tu contraseña?» con este mismo correo para retomar el acceso.\n\nSi no solicitaste este acceso, ignora el mensaje.
emailVerificationBodyHtml=<p>Recibimos una solicitud para usar este correo en {2}.</p><p>Si fuiste tú, confirma tu correo con este enlace:</p><p><a href="{0}">Confirmar mi correo</a></p><p>El enlace caduca en {3}.</p><p>Si estás creando tu cuenta, después de confirmar el correo podrás definir tu contraseña. El acceso para editar catálogos lo habilita el equipo de SIHSALUS.</p><p>Si el enlace venció y aún no puedes entrar, vuelve a Iniciar sesión y selecciona «¿Olvidaste tu contraseña?» con este mismo correo para retomar el acceso.</p><p>Si no solicitaste este acceso, ignora el mensaje.</p>
passwordResetSubject=SIHSALUS: recupera el acceso a tu cuenta
passwordResetBody=Recibimos una solicitud para recuperar el acceso a tu cuenta en {2}.\n\nSi fuiste tú, abre el siguiente enlace para definir una contraseña:\n\n{0}\n\nEl enlace caduca en {3}.\n\nTambién puedes usarlo si no terminaste de crear tu cuenta. Si venció, vuelve a solicitar uno desde «¿Olvidaste tu contraseña?» y abre el mensaje más reciente.\n\nSi no solicitaste el cambio, ignora este mensaje. Tu contraseña se mantendrá igual.
passwordResetBodyHtml=<p>Recibimos una solicitud para recuperar el acceso a tu cuenta en {2}.</p><p>Si fuiste tú, abre el siguiente enlace para definir una contraseña:</p><p><a href="{0}">Definir mi contraseña</a></p><p>El enlace caduca en {3}.</p><p>También puedes usarlo si no terminaste de crear tu cuenta. Si venció, vuelve a solicitar uno desde «¿Olvidaste tu contraseña?» y abre el mensaje más reciente.</p><p>Si no solicitaste el cambio, ignora este mensaje. Tu contraseña se mantendrá igual.</p>
